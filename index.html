<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#03080f">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03080f; --panel:rgba(0,40,60,.35); --line:rgba(0,220,255,.35);
  --cyan:#29e3ff; --cyan-dim:#0b8fb0; --gold:#ffb43a; --red:#ff4d5e;
  --text:#c9f6ff; --muted:#6fa9b8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#03080f}}
:root[data-theme="dark"]{--bg:#03080f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;font-size:17px;overflow-x:hidden;
  background-image:radial-gradient(circle at 50% 30%,rgba(0,140,200,.18),transparent 60%),
  linear-gradient(rgba(0,200,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.04) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px}
.wrap{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;min-height:100%;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;font-family:Orbitron,sans-serif;letter-spacing:.2em;font-size:12px;color:var(--muted)}
header b{color:var(--cyan);font-size:15px}
.gear{background:none;border:1px solid var(--line);color:var(--cyan);font-family:inherit;font-size:11px;letter-spacing:.15em;padding:6px 10px;border-radius:4px;cursor:pointer}
/* reactor */
.core{position:relative;width:min(300px,70vw);aspect-ratio:1;margin:6px auto 0}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line)}
.r1{border-color:transparent;border-top-color:var(--cyan);border-bottom-color:var(--cyan);animation:spin 6s linear infinite}
.r2{inset:12%;border-style:dashed;border-color:var(--cyan-dim);animation:spin 14s linear infinite reverse}
.r3{inset:24%;border-color:transparent;border-left-color:var(--gold);border-right-color:var(--gold);animation:spin 4s linear infinite}
.r4{inset:34%;background:radial-gradient(circle,#e8fdff 0,var(--cyan) 25%,rgba(0,150,200,.25) 60%,transparent 70%);border:none;
  box-shadow:0 0 40px var(--cyan),0 0 90px rgba(41,227,255,.4);animation:pulse 3s ease-in-out infinite}
.core svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.92);opacity:.85}}
body.listening .r4{animation:pulse .6s ease-in-out infinite;box-shadow:0 0 50px var(--gold),0 0 110px rgba(255,180,58,.5)}
body.thinking .r1{animation-duration:1s}
body.speaking .r4{animation:pulse .35s ease-in-out infinite}
.state{text-align:center;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.3em;color:var(--cyan)}
/* log */
.log{flex:1;min-height:180px;max-height:42vh;overflow-y:auto;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;
  clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.msg{line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.msg .who{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.2em;display:block;margin-bottom:2px}
.msg.user .who{color:var(--gold)} .msg.jarvis .who{color:var(--cyan)}
.msg.sys{color:var(--muted);font-size:14px;font-style:italic}
form{display:flex;gap:8px}
input[type=text],input[type=password]{flex:1;min-width:0;background:rgba(0,30,45,.7);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:4px;font:inherit}
input:focus{outline:1px solid var(--cyan)}
.btn{background:rgba(41,227,255,.12);border:1px solid var(--cyan);color:var(--cyan);font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.15em;padding:0 14px;border-radius:4px;cursor:pointer;min-height:44px}
.btn:hover{background:rgba(41,227,255,.25)}
.mic{width:56px;font-size:20px;padding:0}
body.listening .mic{border-color:var(--gold);color:var(--gold);background:rgba(255,180,58,.15)}
.settings{display:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px;gap:10px;flex-direction:column;font-size:15px}
.settings.open{display:flex}
.settings label{display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.settings .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{background:rgba(0,30,45,.7);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:4px;font:inherit}
small{color:var(--muted)}
.memrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
#memList{max-height:160px;overflow-y:auto;font-size:15px}
.briefbtn{display:block;margin:0 auto}
</style>
</head>
<body>
<div class="wrap">
  <header><span><b>J.A.R.V.I.S.</b> &nbsp;MK-I</span><span><span id="pcBadge" title="Jarvis Ponte">PC ○</span> &nbsp;<span id="clock">--:--</span></span><button class="gear" id="gearBtn">CONFIG</button></header>

  <div class="settings" id="settings">
    <div class="row"><span>Cérebro:</span><span id="brainInfo">verificando…</span></div>
    <label>Chave da API Anthropic (só necessária fora do claude.ai; fica salva apenas neste navegador)
      <input type="password" id="apiKey" placeholder="sk-ant-...">
    </label>
    <label>Código do PC (do programa Jarvis Ponte, para controlar o computador) <span id="pcInfo"></span>
      <input type="password" id="pcCode" placeholder="cole aqui o código que a ponte copiou">
    </label>
    <small><a id="ponteLink" style="color:var(--cyan)" href="https://github.com/pedrooriani9p-oss/jarvis/releases/download/ponte/JarvisPonte.exe">Baixar o Jarvis Ponte para Windows</a></small>
    <label>Chave da ElevenLabs (opcional, para vozes premium realistas; grátis em elevenlabs.io)
      <input type="password" id="elKey" placeholder="sk_...">
    </label>
    <div class="row">
      <label style="flex:1">Voz
        <select id="voiceSel"></select>
      </label>
      <button type="button" class="btn" id="testVoice">TESTAR VOZ</button>
      <label>Motor de voz
        <select id="engineSel"><option value="auto">Automático</option><option value="native">Navegador (Chrome/Edge)</option><option value="whisper">Whisper rápido (local, 80 MB)</option><option value="whisper-small">Whisper preciso (local, 250 MB)</option><option value="scribe">ElevenLabs Scribe (nuvem, o mais preciso)</option></select>
      </label>
      <label><span>Falar respostas</span><input type="checkbox" id="speakOn" checked></label>
      <label><span>Sempre ouvindo ("Jarvis")</span><input type="checkbox" id="wakeOn"></label>
      <button type="button" class="btn" id="installBtn" style="display:none">INSTALAR APP</button>
    </div>
    <div class="row">
      <label style="flex:1">Sua cidade (para clima e notícias locais)
        <input type="text" id="cityIn" placeholder="ex: São Paulo">
      </label>
      <label><span>"Bom dia" automático</span><input type="checkbox" id="briefOn"></label>
      <button type="button" class="btn" id="briefBtn">BOM DIA AGORA</button>
    </div>
    <div>O que o Jarvis sabe sobre você (fica neste aparelho):<div id="memList"></div></div>
    <small>Toque no microfone para falar. Com "Sempre ouvindo" ligado, basta dizer "Jarvis" (ex: "Jarvis, que horas são?") enquanto o app estiver aberto.</small>
  </div>

  <div class="core" aria-hidden="true">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
    <svg viewBox="0 0 100 100"><g fill="none" stroke="#29e3ff" stroke-opacity=".5" stroke-width=".4">
      <circle cx="50" cy="50" r="48" stroke-dasharray="1 3"/></g>
      <g fill="#29e3ff" fill-opacity=".7" font-size="2.6" font-family="Orbitron">
      <text x="50" y="5" text-anchor="middle">SYS ONLINE</text><text x="50" y="97" text-anchor="middle">STARK INDUSTRIES</text></g></svg>
  </div>
  <div class="state" id="state">EM ESPERA</div>

  <div class="log" id="log" aria-live="polite"></div>

  <form id="form">
    <button type="button" class="btn mic" id="micBtn" title="Falar">🎙</button>
    <input type="text" id="text" placeholder="Fale ou digite um comando, senhor…" autocomplete="off">
    <button class="btn" type="submit">ENVIAR</button>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), stateEl = $('state');
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

const SYSTEM = `Você é J.A.R.V.I.S., a inteligência artificial pessoal criada por Tony Stark, agora servindo ao usuário.
Personalidade: educado, britânico no estilo, levemente irônico e espirituoso, sempre leal e eficiente. Chame o usuário de "senhor".
Responda em português do Brasil, de forma curta e falada (1 a 3 frases), porque sua resposta será lida em voz alta. Sem markdown, sem listas, sem emojis, sem links ou citações de fontes.
Use as ferramentas quando ajudarem: hora, abrir sites, timers, notas, pesquisa na web (clima, notícias, resultados, preços, qualquer coisa atual) e, se disponíveis, controle do PC e visão da tela. Antes de desligar, reiniciar ou fechar programas, confirme com o usuário. Só olhe a tela quando o usuário pedir.
Memória: quando o usuário contar algo duradouro sobre ele (nome, cidade, gostos, rotina, pessoas, objetivos) ou pedir para lembrar de algo, use a ferramenta memorizar sem anunciar demais. Se ele pedir para esquecer, use esquecer.`;
function systemNow(){
  const mem=loadMem(), city=store.get('jarvis_city');
  return SYSTEM+'\n\nData/hora local atual: '+new Date().toLocaleString('pt-BR',{dateStyle:'full',timeStyle:'short'})+'.'+
    (city?'\nCidade do usuário: '+city+'.':'')+
    (mem.length?'\n\nO que você já sabe sobre o usuário:\n'+mem.map(m=>'- '+m.fato).join('\n'):'');
}

// ---------- tools (page functions Claude can call) ----------
// ---------- memória (neste aparelho) ----------
function loadMem(){ try{ return JSON.parse(store.get('jarvis_mem')||'[]'); }catch(e){ return []; } }
function saveMem(m){ store.set('jarvis_mem',JSON.stringify(m.slice(-200))); }
function renderMem(){
  const box=document.getElementById('memList'); if(!box) return; const m=loadMem(); box.innerHTML='';
  if(!m.length){ box.textContent='Nada ainda. Conte coisas sobre você e ele vai lembrando.'; return; }
  m.forEach((x,i)=>{ const row=document.createElement('div'); row.className='memrow'; const t=document.createElement('span'); t.textContent=x.fato;
    const b=document.createElement('button'); b.className='gear'; b.textContent='✕'; b.title='Esquecer'; b.onclick=()=>{ const k=loadMem(); k.splice(i,1); saveMem(k); renderMem(); };
    row.append(t,b); box.append(row); });
}

// ---------- visão da tela ----------
// Pela ponte (sem perguntar nada) ou, sem ponte, pelo compartilhamento de tela do navegador.
async function captureScreen(){
  if(typeof pcOnline!=='undefined' && pcOnline){
    const r=await ponte('capturar_tela',{}); if(r.ok&&r.imagem) return {__image:r.imagem, info:'captura da tela do PC'};
  }
  if(!navigator.mediaDevices?.getDisplayMedia) return {erro:'este aparelho não permite capturar a tela'};
  const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
  try{
    const v=document.createElement('video'); v.srcObject=stream; v.muted=true; await v.play(); await new Promise(r=>setTimeout(r,300));
    const sc=Math.min(1,1568/v.videoWidth), c=document.createElement('canvas'); c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc);
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    return {__image:c.toDataURL('image/jpeg',0.7).split(',')[1], info:'captura da tela'};
  } finally { stream.getTracks().forEach(t=>t.stop()); }
}

const notes = JSON.parse(store.get('jarvis_notes') || '[]');
const TOOLS = [
  { name:'hora_atual', description:'Retorna data e hora locais do usuário.', inputSchema:{type:'object',properties:{}},
    execute:()=>({agora:new Date().toLocaleString('pt-BR',{dateStyle:'full',timeStyle:'short'})}) },
  { name:'abrir_site', description:'Abre uma URL em nova aba (ex: YouTube, Google, uma busca).', inputSchema:{type:'object',properties:{url:{type:'string'}},required:['url']},
    execute:({url})=>{ if(!/^https?:\/\//.test(url)) url='https://'+url; const w=window.open(url,'_blank','noopener'); return {aberto:!!w||'pode ter sido bloqueado pelo navegador', url}; } },
  { name:'criar_timer', description:'Cria um timer; quando terminar, o Jarvis avisa em voz alta.', inputSchema:{type:'object',properties:{segundos:{type:'number'},rotulo:{type:'string'}},required:['segundos']},
    execute:({segundos,rotulo})=>{ setTimeout(()=>{ const t=`Senhor, o timer${rotulo?' "'+rotulo+'"':''} terminou.`; add('jarvis',t); speak(t); }, segundos*1000); return {ok:true,segundos}; } },
  { name:'salvar_nota', description:'Salva uma nota/lembrete do usuário neste navegador.', inputSchema:{type:'object',properties:{texto:{type:'string'}},required:['texto']},
    execute:({texto})=>{ notes.push({texto,em:new Date().toISOString()}); store.set('jarvis_notes',JSON.stringify(notes)); return {ok:true,total:notes.length}; } },
  { name:'listar_notas', description:'Lista as notas salvas.', inputSchema:{type:'object',properties:{}}, execute:()=>({notas:notes}) },
  { name:'memorizar', description:'Guarda um fato duradouro sobre o usuário (ex: "O nome dele é Pedro", "Torce para o Palmeiras").', inputSchema:{type:'object',properties:{fato:{type:'string'}},required:['fato']},
    execute:({fato})=>{ const m=loadMem(); if(!m.some(x=>x.fato===fato)) m.push({fato,em:new Date().toISOString()}); saveMem(m); renderMem(); return {ok:true,total:m.length}; } },
  { name:'esquecer', description:'Apaga memórias que contenham o trecho informado.', inputSchema:{type:'object',properties:{trecho:{type:'string'}},required:['trecho']},
    execute:({trecho})=>{ const m=loadMem(), t=trecho.toLowerCase(), k=m.filter(x=>!x.fato.toLowerCase().includes(t)); saveMem(k); renderMem(); return {ok:true,apagadas:m.length-k.length}; } },
  { name:'ver_tela', description:'Captura a tela do usuário para você ver o que está nela. Use só quando ele pedir (ex: "o que tem na minha tela?", "me ajuda com isso aqui").', inputSchema:{type:'object',properties:{}},
    execute:()=>captureScreen() }
];

// ---------- controle do PC (via programa Jarvis Ponte, rodando no próprio computador) ----------
const PONTE='http://127.0.0.1:47800';
let pcOnline=false;
async function ponte(acao,args){
  const r=await fetch(`${PONTE}/acao/${acao}`,{method:'POST',headers:{'content-type':'application/json','x-jarvis-codigo':store.get('jarvis_pc')||''},body:JSON.stringify(args||{})});
  return r.json();
}
const S=(props,req)=>({type:'object',properties:props,required:req||[]});
const PC_TOOLS=[
  {name:'pc_abrir_programa',description:'Abre um programa ou jogo instalado no PC pelo nome (ex: calculadora, spotify, chrome, word, nome de um jogo).',inputSchema:S({nome:{type:'string'}},['nome']),execute:a=>ponte('abrir_programa',a)},
  {name:'pc_fechar_programa',description:'Fecha um programa aberto pelo nome do processo (ex: chrome, notepad, spotify). Confirme com o usuário antes.',inputSchema:S({nome:{type:'string'}},['nome']),execute:a=>ponte('fechar_programa',a)},
  {name:'pc_volume',description:'Sobe, desce ou silencia o volume do PC. passos: 1 a 50 (cada passo ~2%).',inputSchema:S({acao:{type:'string',enum:['subir','descer','mudo']},passos:{type:'number'}},['acao']),execute:a=>ponte('volume',a)},
  {name:'pc_midia',description:'Controla a música/vídeo tocando no PC.',inputSchema:S({acao:{type:'string',enum:['tocar_pausar','proxima','anterior','parar']}},['acao']),execute:a=>ponte('midia',a)},
  {name:'pc_energia',description:'Desliga, reinicia (ambos em 60s), cancela desligamento ou bloqueia a tela. Confirme antes de desligar ou reiniciar.',inputSchema:S({acao:{type:'string',enum:['desligar','reiniciar','cancelar','bloquear']}},['acao']),execute:a=>ponte('energia',a)},
  {name:'pc_print_tela',description:'Tira um print da tela e salva em Imagens\\Jarvis.',inputSchema:S({}),execute:()=>ponte('print_tela',{})},
  {name:'pc_abrir_pasta',description:'Abre uma pasta: documentos, downloads, área de trabalho, imagens, músicas, vídeos.',inputSchema:S({nome:{type:'string'}},['nome']),execute:a=>ponte('abrir_pasta',a)},
  {name:'pc_procurar_arquivos',description:'Procura arquivos pelo nome na pasta do usuário. Retorna até 15 com caminho.',inputSchema:S({termo:{type:'string'}},['termo']),execute:a=>ponte('procurar_arquivos',a)},
  {name:'pc_abrir_arquivo',description:'Abre um arquivo (documento, foto, vídeo) pelo caminho completo, geralmente vindo de pc_procurar_arquivos.',inputSchema:S({caminho:{type:'string'}},['caminho']),execute:a=>ponte('abrir_arquivo',a)},
  {name:'pc_info_sistema',description:'Informa bateria, espaço em disco e nome do PC.',inputSchema:S({}),execute:()=>ponte('info_sistema',{})},
  {name:'pc_digitar',description:'Digita/cola um texto onde o cursor estiver no PC (ex: ditar um texto num documento).',inputSchema:S({texto:{type:'string'}},['texto']),execute:a=>ponte('digitar',a)},
];
const activeTools=()=>pcOnline?TOOLS.concat(PC_TOOLS):TOOLS;
async function checkPonte(){
  let st=null;
  try{ const r=await fetch(PONTE+'/status',{headers:{'x-jarvis-codigo':store.get('jarvis_pc')||''}}); st=await r.json(); }catch(e){}
  const was=pcOnline; pcOnline=!!(st&&st.pareado);
  $('pcBadge').textContent=pcOnline?'PC ●':'PC ○'; $('pcBadge').style.color=pcOnline?'var(--cyan)':'';
  $('pcInfo').textContent=pcOnline?'· conectado ✓':(st?'· ponte encontrada, código errado':'· ponte não encontrada');
  if(pcOnline&&!was) add('sys','Controle do PC conectado. Tente: "Jarvis, abre a calculadora".');
}
$('pcCode').value=store.get('jarvis_pc')||'';
$('pcCode').onchange=e=>{ store.set('jarvis_pc',e.target.value.trim()); checkPonte(); };
if(!window.claude){ checkPonte(); setInterval(checkPonte,20000); }

// ---------- UI ----------
function add(who, text){
  const d=document.createElement('div'); d.className='msg '+who;
  if(who==='sys'){ d.textContent=text; }
  else { const w=document.createElement('span'); w.className='who'; w.textContent= who==='user'?'VOCÊ':'JARVIS'; const b=document.createElement('span'); b.textContent=text; d.append(w,b); }
  log.append(d); log.scrollTop=log.scrollHeight; return d;
}
function setState(s){ document.body.className=s; stateEl.textContent={'':'EM ESPERA',listening:'OUVINDO…',thinking:'PROCESSANDO…',speaking:'RESPONDENDO…'}[s]; }
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),1000);
$('gearBtn').onclick=()=>$('settings').classList.toggle('open');
$('apiKey').value=store.get('jarvis_key')||''; $('apiKey').onchange=e=>{store.set('jarvis_key',e.target.value.trim()); refreshBrain();};
$('speakOn').checked=store.get('jarvis_speak')!=='0'; $('speakOn').onchange=e=>store.set('jarvis_speak',e.target.checked?'1':'0');

// ---------- voice out ----------
// Vozes premium (ElevenLabs, realistas, precisam de chave) + vozes do próprio navegador (grátis).
const ELEVEN=[
  {id:'onwK4e9ZLuTAKqWW03F9',name:'Daniel (britânico, grave, o mais "Jarvis")'},
  {id:'JBFqnCBsd6RMkjVDRZzb',name:'George (britânico, caloroso)'},
  {id:'nPczCjzI2devNBz1zQrb',name:'Brian (grave, calmo)'},
  {id:'pNInz6obpgDQGcFmaJgB',name:'Adam (grave, firme)'},
];
let voices=[], audio=null;
function loadVoices(){
  const all='speechSynthesis' in window?speechSynthesis.getVoices():[];
  voices=all.filter(v=>/^pt/i.test(v.lang)); if(!voices.length) voices=all;
  // vozes "Natural"/"Online" (Edge) e Google soam bem melhor: vão para o topo
  const score=v=>(/natural|online|neural/i.test(v.name)?2:0)+(/google/i.test(v.name)?1:0);
  voices.sort((x,y)=>score(y)-score(x));
  const sel=$('voiceSel'), saved=store.get('jarvis_voice'); sel.innerHTML='';
  const g1=document.createElement('optgroup'); g1.label='Premium (ElevenLabs, precisa de chave)';
  ELEVEN.forEach(v=>{const o=document.createElement('option');o.value='el:'+v.id;o.textContent='⭐ '+v.name;g1.append(o);});
  const g2=document.createElement('optgroup'); g2.label='Do navegador (grátis)';
  voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=`${v.name} (${v.lang})`;g2.append(o);});
  sel.append(g1,g2);
  const male=voices.find(v=>/antonio|daniel|ricardo|male|masculin/i.test(v.name))||voices[0];
  const fallback = store.get('jarvis_elkey') ? 'el:'+ELEVEN[0].id : (male||{}).name||'';
  sel.value = saved && [...sel.options].some(o=>o.value===saved) ? saved : fallback;
}
loadVoices(); if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=loadVoices;
$('voiceSel').onchange=e=>{ store.set('jarvis_voice',e.target.value); if(e.target.value.startsWith('el:') && !store.get('jarvis_elkey')) add('sys','Para as vozes premium, cole sua chave da ElevenLabs logo abaixo.'); };
$('elKey').value=store.get('jarvis_elkey')||'';
$('elKey').onchange=e=>{ store.set('jarvis_elkey',e.target.value.trim()); if(e.target.value.trim()){ $('voiceSel').value='el:'+ELEVEN[0].id; store.set('jarvis_voice',$('voiceSel').value); } };
$('testVoice').onclick=()=>speak('Às suas ordens, senhor. Todos os sistemas estão operacionais.');
function stopSpeaking(){ if('speechSynthesis' in window) speechSynthesis.cancel(); if(audio){ audio.pause(); audio=null; } }
function speakBrowser(text,res){
  if(!('speechSynthesis' in window)) return res();
  const u=new SpeechSynthesisUtterance(text); u.lang='pt-BR'; u.rate=1.02; u.pitch=.85;
  const v=voices.find(v=>v.name===$('voiceSel').value); if(v) u.voice=v;
  if(v && /natural|online|neural/i.test(v.name)) u.pitch=1; // vozes neurais já soam naturais
  u.onstart=()=>setState('speaking'); u.onend=u.onerror=()=>{setState('');res();};
  speechSynthesis.speak(u);
}
async function speakEleven(text,voiceId,res){
  const key=store.get('jarvis_elkey'); if(!key){ add('sys','Sem chave da ElevenLabs: usando a voz do navegador.'); return speakBrowser(text,res); }
  setState('speaking');
  try{
    const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}?output_format=mp3_44100_128`,{method:'POST',
      headers:{'xi-api-key':key,'content-type':'application/json','accept':'audio/mpeg'},
      body:JSON.stringify({text,model_id:'eleven_multilingual_v2',voice_settings:{stability:.5,similarity_boost:.8,style:.15}})});
    if(!r.ok){ let m=r.status; try{const j=await r.json(); m=j.detail?.message||j.detail?.status||JSON.stringify(j.detail)||m;}catch(e){} throw new Error(m); }
    const url=URL.createObjectURL(await r.blob()); audio=new Audio(url);
    audio.onended=audio.onerror=()=>{URL.revokeObjectURL(url); audio=null; setState(''); res();};
    await audio.play();
  }catch(e){ add('sys','A voz premium falhou ('+(e.message||e)+'). Usando a voz do navegador.'); speakBrowser(text,res); }
}
function speak(text){
  return new Promise(res=>{
    if(!$('speakOn').checked) return res();
    stopSpeaking();
    const v=$('voiceSel').value||'';
    if(v.startsWith('el:')) speakEleven(text,v.slice(3),res); else speakBrowser(text,res);
  });
}

// ---------- voice in ----------
// Dois modos: toque no microfone (um comando) ou "sempre ouvindo", que espera a palavra "Jarvis".
// Dois motores: o do navegador (Chrome/Edge) e um Whisper local que roda em qualquer navegador (Opera, Firefox...).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const WAKE=/\b(jarvis|jarbas|djarvis|jervis|jarviz|javis)\b[,.!]?\s*/i;
let rec=null, listening=false, mode='idle', armed=false, armTimer=null; // mode: idle | ptt | wake
const wakeOn=()=>$('wakeOn').checked;
$('wakeOn').checked=store.get('jarvis_wake')==='1';
const nativeOk = !!SR && !/OPR\/|Opera|Firefox|Brave/i.test(navigator.userAgent) && !navigator.brave;
let engine = store.get('jarvis_engine') || 'auto';
$('engineSel').value=engine;
const useWhisper=()=> ['whisper','whisper-small','scribe'].includes(engine) || (engine==='auto' && !nativeOk);
// no automático sem reconhecimento do navegador: Scribe se houver chave da ElevenLabs, senão Whisper preciso
const sttKind=()=> engine==='scribe'||(engine==='auto'&&!nativeOk&&store.get('jarvis_elkey'))?'scribe': engine==='whisper'?'whisper':'whisper-small';
const ENGINE_NAME={whisper:'Whisper rápido',['whisper-small']:'Whisper preciso',scribe:'ElevenLabs Scribe'};
$('engineSel').onchange=e=>{ stopRec(); engine=e.target.value; store.set('jarvis_engine',engine); add('sys','Motor de voz: '+(useWhisper()?ENGINE_NAME[sttKind()]:'navegador')+'.'); if(useWhisper()&&sttKind()!=='scribe') loadAsr().catch(()=>{}); resumeWake(); };

function startRec(m){ if(listening||busy||document.body.className==='speaking') return; mode=m; if(useWhisper()) return wStart(); if(!rec) return; rec.continuous=(m==='wake'); try{rec.start();}catch(e){} }
function stopRec(){ if(!listening) return; if(useWhisper()) return wStop(); if(rec) try{rec.stop();}catch(e){} }
function resumeWake(){ if(wakeOn()) setTimeout(()=>startRec('wake'),300); }
function arm(){ armed=true; clearTimeout(armTimer); armTimer=setTimeout(()=>{armed=false;},8000); }
function idleLabel(){ setState(mode==='wake'&&!armed?'':'listening'); if(mode==='wake') stateEl.textContent=armed?'OUVINDO…':'AGUARDANDO "JARVIS"'; }
// texto final reconhecido, venha de qual motor vier
function heard(said){
  said=said.trim(); if(!said) return;
  if(mode==='ptt'){ $('text').value=said; stopRec(); submit(); return; }
  const m=said.match(WAKE); let cmd=null;
  if(m) cmd=said.slice(m.index+m[0].length).replace(/^[\s,.!?]+/,'').trim(); else if(armed) cmd=said;
  if(cmd===null) return;
  if(!cmd || cmd.length<2){ arm(); stopRec(); $('text').value=''; speak('Pois não, senhor?').then(()=>startRec('wake')); return; }
  armed=false; $('text').value=cmd; stopRec(); submit();
}

// --- motor 1: reconhecimento do navegador ---
if(SR){
  rec=new SR(); rec.lang='pt-BR'; rec.interimResults=true; rec.maxAlternatives=3;
  rec.onstart=()=>{listening=true; idleLabel();};
  rec.onresult=e=>{
    const r=e.results[e.results.length-1]; let said=r[0].transcript.trim();
    if(mode==='wake') for(let k=0;k<r.length;k++) if(WAKE.test(r[k].transcript)){ said=r[k].transcript.trim(); break; }
    if(!r.isFinal){ if(mode==='ptt'||armed||WAKE.test(said)){ setState('listening'); $('text').value=said; } return; }
    heard(said);
  };
  rec.onerror=e=>{
    if(['network','service-not-allowed','language-not-supported'].includes(e.error) && engine==='auto'){ engine='whisper'; add('sys','O reconhecimento deste navegador falhou; mudei para o Whisper local.'); loadAsr().then(()=>startRec(mode==='idle'?'ptt':mode)); }
    else if(e.error==='not-allowed'){ $('wakeOn').checked=false; add('sys','Microfone bloqueado. Libere o microfone para este site nas configurações do navegador.'); }
  };
  rec.onend=()=>{ listening=false; if(document.body.className==='listening') setState(''); if(mode==='wake'&&!busy&&document.body.className!=='speaking') resumeWake(); };
}

// --- motor 2: Whisper local (transformers.js), com detecção de fala por volume ---
const W={asr:null,model:'',loading:null,failedAt:0,stream:null,ctx:null,proc:null,active:false,inSpeech:false,chunks:[],pre:[],silent:0,len:0,noise:0.01,started:0,transcribing:false};
const JUNK=/amara\.org|legendas pela|inscreva-se|obrigad[oa] por assistir|^\W*(m+|hum+|\.+)\W*$/i;
function loadAsr(){
  const model=sttKind()==='whisper'?'Xenova/whisper-base':'Xenova/whisper-small';
  if(W.model!==model){ W.asr=null; W.loading=null; W.failedAt=0; W.model=model; }
  if(W.asr) return Promise.resolve(W.asr);
  if(!W.loading && Date.now()-W.failedAt<30000) return Promise.reject(new Error('aguardando'));
  if(!W.loading){
    add('sys',`Baixando o reconhecimento de voz (${model.endsWith('small')?'uns 250':'uns 80'} MB, só na primeira vez)…`);
    W.loading=import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1').then(async T=>{
      const asr=await T.pipeline('automatic-speech-recognition',model,{
        progress_callback:p=>{ if(p.status==='progress' && /onnx/.test(p.file||'')) stateEl.textContent='CARREGANDO VOZ '+Math.round(p.progress||0)+'%'; }});
      if(W.model!==model) return asr; W.asr=asr;
      add('sys','Reconhecimento de voz pronto, senhor.'); if(!listening) setState(''); return W.asr;
    }).catch(e=>{ W.loading=null; W.failedAt=Date.now(); add('sys','Não consegui baixar o reconhecimento de voz: '+(e.message||e)); throw e; });
  }
  return W.loading;
}
// áudio 16 kHz -> WAV, para mandar ao ElevenLabs Scribe
function toWav(f32){
  const b=new ArrayBuffer(44+f32.length*2), v=new DataView(b), w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4,36+f32.length*2,true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,16000,true); v.setUint32(28,32000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,f32.length*2,true);
  for(let i=0;i<f32.length;i++){ const x=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true); }
  return new Blob([b],{type:'audio/wav'});
}
async function transcribe(audio){
  if(sttKind()==='scribe'){
    const key=store.get('jarvis_elkey'); if(!key) throw new Error('sem chave da ElevenLabs');
    const fd=new FormData(); fd.append('file',toWav(audio),'fala.wav'); fd.append('model_id','scribe_v1'); fd.append('language_code','por'); fd.append('tag_audio_events','false');
    const r=await fetch('https://api.elevenlabs.io/v1/speech-to-text',{method:'POST',headers:{'xi-api-key':key},body:fd});
    const j=await r.json(); if(!r.ok) throw new Error(j.detail?.message||j.detail?.status||r.status);
    return j.text||'';
  }
  const asr=await loadAsr();
  return (await asr(audio,{language:'portuguese',task:'transcribe'})).text||'';
}
async function wStart(){
  try{
    if(sttKind()!=='scribe') loadAsr().catch(()=>{});
    if(!W.stream){
      W.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      const AC=window.AudioContext||window.webkitAudioContext; let src;
      try{ W.ctx=new AC({sampleRate:16000}); src=W.ctx.createMediaStreamSource(W.stream); }
      catch(e){ W.ctx=new AC(); src=W.ctx.createMediaStreamSource(W.stream); } // Firefox: taxa nativa, reamostra depois
      W.proc=W.ctx.createScriptProcessor(2048,1,1);
      W.proc.onaudioprocess=e=>wChunk(e.inputBuffer.getChannelData(0));
      src.connect(W.proc); W.proc.connect(W.ctx.destination);
    }
    if(W.ctx.state==='suspended') await W.ctx.resume();
    W.active=true; W.inSpeech=false; W.chunks=[]; W.started=performance.now(); listening=true; idleLabel();
  }catch(e){ listening=false; $('wakeOn').checked=false; add('sys','Não consegui acessar o microfone: '+(e.message||e.name)+'. Libere o microfone para este site.'); }
}
function wStop(){ W.active=false; W.inSpeech=false; listening=false; if(document.body.className==='listening') setState(''); }
function wChunk(buf){
  if(!W.active || W.transcribing || busy || document.body.className==='speaking') return;
  const d=buf.slice(); let sum=0; for(let i=0;i<d.length;i++) sum+=d[i]*d[i];
  const rms=Math.sqrt(sum/d.length), ms=d.length/W.ctx.sampleRate*1000, loud=rms>Math.max(0.015,W.noise*3);
  if(!W.inSpeech){
    W.noise=W.noise*0.95+rms*0.05; W.pre.push(d); if(W.pre.length>6) W.pre.shift();
    if(loud){ W.inSpeech=true; W.chunks=W.pre.slice(); W.pre=[]; W.silent=0; W.len=0; if(mode==='ptt'||armed) setState('listening'); }
    else if(mode==='ptt' && performance.now()-W.started>8000){ wStop(); add('sys','Não ouvi nada, senhor.'); }
    return;
  }
  W.chunks.push(d); W.len+=ms; W.silent=loud?0:W.silent+ms;
  if(W.silent>1300 || W.len>15000) wFinish();
}
async function wFinish(){
  const chunks=W.chunks; W.inSpeech=false; W.chunks=[];
  const total=chunks.reduce((n,c)=>n+c.length,0); if(total<W.ctx.sampleRate*0.4) return;
  const raw=new Float32Array(total); let o=0; for(const c of chunks){ raw.set(c,o); o+=c.length; }
  const r=W.ctx.sampleRate/16000, audio=r===1?raw:Float32Array.from({length:Math.floor(total/r)},(_,i)=>raw[Math.floor(i*r)]);
  W.transcribing=true; const prev=stateEl.textContent; stateEl.textContent='TRANSCREVENDO…';
  try{
    const txt=(await transcribe(audio)).trim();
    W.transcribing=false;
    if(txt && !JUNK.test(txt)) heard(txt); else if(listening) idleLabel();
  }catch(e){ W.transcribing=false; stateEl.textContent=prev; if(sttKind()==='scribe') add('sys','O Scribe falhou ('+(e.message||e)+').'); }
}

$('wakeOn').onchange=e=>{ store.set('jarvis_wake',e.target.checked?'1':'0'); if(!SR && !navigator.mediaDevices){ e.target.checked=false; return add('sys','Este navegador não dá acesso ao microfone.'); } if(e.target.checked) startRec('wake'); else { mode='idle'; stopRec(); setState(''); } };
$('micBtn').onclick=()=>{
  stopSpeaking();
  if(listening && mode==='ptt') return stopRec();
  if(listening) { stopRec(); setTimeout(()=>startRec('ptt'),250); } else startRec('ptt');
};
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) resumeWake(); });
if(useWhisper()&&sttKind()!=='scribe') setTimeout(()=>loadAsr().catch(()=>{}),500);

// ---------- install (PWA) ----------
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('installBtn').style.display=''; });
$('installBtn').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt=null; $('installBtn').style.display='none'; };
if('serviceWorker' in navigator && location.protocol==='https:' && !window.claude) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---------- brain ----------
let sample=null; const history=[];
async function initBrain(){ try{ if(window.claude?.use) sample=await window.claude.use('sample'); }catch(e){} refreshBrain(); }
function refreshBrain(){
  $('brainInfo').textContent = sample ? 'Claude via sua conta claude.ai (nenhuma chave necessária)'
    : (store.get('jarvis_key') ? 'Claude via chave de API' : 'sem conexão: informe uma chave de API');
}
async function askViaSample(msgs, onText){
  const turns = msgs.map((m,i)=> i===0 && m.role==='user' ? {...m, content: systemNow()+'\n\nUsuário: '+m.content} : m);
  const {text}=await sample(turns,{tools:activeTools().filter(t=>t.name!=='ver_tela'), modelTier:'quick', cache:false, onText:({text})=>onText(text)});
  return text;
}
async function askViaApi(msgs, onText){
  const key=store.get('jarvis_key'); if(!key) throw {code:'no_key'};
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  const tools=activeTools().map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));
  tools.push({type:'web_search_20260209',name:'web_search',max_uses:3,user_location:{type:'approximate',country:'BR',timezone:tz,...(store.get('jarvis_city')?{city:store.get('jarvis_city')}:{})}});
  let convo=msgs.map(m=>({role:m.role,content:m.content}));
  const system=systemNow(); // fixo durante o pedido: o raciocínio do Claude fica preso ao prompt exato
  for(let round=0;round<8;round++){
    onText(round?'…':'…');
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01',
        'anthropic-beta':'server-side-fallback-2026-07-01,thinking-binding-controls-2026-08-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-5-5',max_tokens:4000,output_config:{effort:'low'},fallbacks:'default',
        thinking:{type:'adaptive',block_binding:{prefix_mismatch_behavior:'drop_block'}},system,tools,messages:convo})});
    const j=await r.json(); if(!r.ok) throw {code:'api',message:j.error?.message||r.status};
    if(j.stop_reason==='refusal') return 'Receio que não posso ajudar com isso, senhor.';
    const txt=j.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
    const uses=j.content.filter(c=>c.type==='tool_use');
    if(j.stop_reason==='pause_turn'){ convo.push({role:'assistant',content:j.content}); continue; } // pesquisa longa: continua
    if(!uses.length){ onText(txt); return txt; }
    convo.push({role:'assistant',content:j.content});
    convo.push({role:'user',content:await Promise.all(uses.map(async u=>{
      const t=activeTools().find(t=>t.name===u.name); let out;
      try{ out=await t.execute(u.input||{}); }catch(e){ return {type:'tool_result',tool_use_id:u.id,is_error:true,content:String(e.message||e)}; }
      if(out&&out.__image) return {type:'tool_result',tool_use_id:u.id,content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:out.__image}},{type:'text',text:out.info||'tela'}]};
      return {type:'tool_result',tool_use_id:u.id,content:JSON.stringify(out)};
    }))});
  }
  return 'Desculpe, senhor, me perdi nos cálculos.';
}
const ERR={not_granted:'Preciso da sua permissão para usar o Claude, senhor. Recarregue e permita.',rate_limited:'Muitos pedidos seguidos, senhor. Um momento.',
  no_key:'Estou sem cérebro conectado, senhor. Abra CONFIG e informe uma chave de API.'};
let busy=false;
async function submit(hidden){
  let q=$('text').value.trim(); if(!q||busy) return; hidden=hidden===true;
  q=q.replace(/^(ok |ei |hey )?jarvis[,!]?\s*/i,'')||q; $('text').value='';
  add('user',hidden?'☀️ Resumo do dia':q); history.push({role:'user',content:q}); while(history.length>16 || (history.length && history[0].role!=="user")) history.shift();
  busy=true; setState('thinking'); const el=add('jarvis','…'); const body=el.lastChild;
  try{
    const ans = sample ? await askViaSample(history, t=>body.textContent=t) : await askViaApi(history, t=>body.textContent=t);
    body.textContent=ans; history.push({role:'assistant',content:ans});
    busy=false;
    if(hidden && navigator.userActivation && !navigator.userActivation.hasBeenActive){
      // o navegador não deixa falar antes de você tocar na página: oferece um botão
      const b=document.createElement('button'); b.className='btn briefbtn'; b.textContent='▶ OUVIR RESUMO';
      b.onclick=()=>{ b.remove(); speak(ans).then(resumeWake); }; el.append(b); return;
    }
    await speak(ans);
    resumeWake();
  }catch(e){
    history.pop(); const m=ERR[e.code]||('Falha nos sistemas, senhor: '+(e.message||e.code||e)); body.textContent=m; busy=false; speak(m).then(resumeWake);
  }finally{ busy=false; if(document.body.className==='thinking') setState(''); }
}
$('form').onsubmit=e=>{e.preventDefault();submit();};

// ---------- "Bom dia, senhor" ----------
// Na primeira abertura do dia, o Jarvis faz um resumo falado: saudação, clima, notícias e notas.
$('cityIn').value=store.get('jarvis_city')||''; $('cityIn').onchange=e=>store.set('jarvis_city',e.target.value.trim());
$('briefOn').checked=store.get('jarvis_brief')!=='0'; $('briefOn').onchange=e=>store.set('jarvis_brief',e.target.checked?'1':'0');
renderMem();
function briefingPrompt(){
  const h=new Date().getHours(), saud=h<12?'bom dia':h<18?'boa tarde':'boa noite', city=store.get('jarvis_city');
  return `[Resumo automático ao iniciar] Faça o briefing de ${saud} do senhor, em até 6 frases faladas e naturais: cumprimente pelo nome se souber, diga a data, `+
    (city?`pesquise e diga o clima de hoje em ${city} (temperatura e chance de chuva), `:'')+
    `pesquise e conte 2 notícias importantes do Brasil hoje (uma frase cada)`+(notes.length?`, e lembre as notas salvas que ainda pareçam relevantes`:'')+`. Termine perguntando como pode ajudar.`;
}
async function briefing(){
  if(busy) return;
  if(!sample && !store.get('jarvis_key')) return;
  store.set('jarvis_brief_day',new Date().toDateString());
  $('text').value=briefingPrompt(); await submit(true);
}
$('briefBtn').onclick=()=>briefing();
function maybeBriefing(){
  if(store.get('jarvis_brief')==='0' || store.get('jarvis_brief_day')===new Date().toDateString()) return;
  setTimeout(briefing,1500);
}

add('sys','Sistemas online. Toque no microfone, digite, ou ligue "Sempre ouvindo" em CONFIG e diga "Jarvis". Tente: "Que horas são?", "Abra o YouTube", "Me lembre em 1 minuto de beber água".');
initBrain().then(maybeBriefing);
if(wakeOn()) setTimeout(()=>startRec('wake'),800);
</script>
